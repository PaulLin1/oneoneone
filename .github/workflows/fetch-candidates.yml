name: Fetch candidates

# Restocks the review queue (content_candidates, status = needs_review) from
# seed/source-pool.json. Never touches `works` and never goes live on its
# own — see "Content pipeline" in README.md. Someone still has to run
# `npm run review` by hand to approve or reject what lands here.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many candidates to fetch"
        default: "5"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/fetch-candidates.ts ${{ github.event.inputs.count || '5' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
