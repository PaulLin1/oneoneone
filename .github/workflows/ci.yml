name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      # No DATABASE_URL needed: every route that touches the DB is
      # server-rendered on demand (ƒ), not statically prerendered, so
      # `next build` never has to reach the database.
      - run: npm run build
