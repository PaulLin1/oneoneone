name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # tsc needs .next/types/ (LayoutProps, PageProps, etc.) to exist first
      # — a fresh checkout has no .next/ at all, and this repo's own npm
      # run build comes after tsc below, so without this step CI fails on
      # "Cannot find name 'LayoutProps'" even though it works locally
      # (where .next/ already exists from prior next dev/build runs).
      # typegen only generates types, not a full build, so it stays fast.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm test

      # No DATABASE_URL needed: every route that touches the DB is
      # server-rendered on demand (ƒ), not statically prerendered, so
      # `next build` never has to reach the database.
      - run: npm run build
