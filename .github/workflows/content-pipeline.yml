name: Content pipeline

# Fetches and reviews new content candidates unattended — all the judgment
# calls a human reviewer would normally make, done by a Claude Code agent
# instead. Author portraits are a separate, less-frequent workflow
# (author-portraits.yml) — that part used to live here too, but its
# uncapped retry-per-author loop was the main reason a run could take 30+
# minutes and burn far more tokens than the fetch+review work needed. See
# "Automation" in README.md for the full picture.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  # anthropics/claude-code-action needs this to fetch an OIDC token for its
  # own auth — without it, the action fails immediately on "Requesting OIDC
  # token..." before ever reaching the actual pipeline steps.
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Independent of --max-budget-usd below — if the action ever fails to
    # honor that flag, this is the backstop that still kills a runaway run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --model: this is rule-following work (explicit criteria, no
          # open-ended design judgment) — Sonnet is plenty, and costs a
          # fraction of whatever the action's own default is.
          # --max-budget-usd: a hard ceiling. Every other cap in this prompt
          # is a *should*; this is the actual backstop if the agent goes off
          # the rails anyway — it stops mid-run rather than running up a
          # bill with nothing to show for it.
          claude_args: '--model claude-sonnet-5 --max-budget-usd 2 --allowed-tools "Bash,Read,Edit,Write,WebFetch,WebSearch"'
          prompt: |
            You're running the oneoneone content pipeline unattended, on a
            schedule, standing in for the human reviewer this project's docs
            describe. This is a recurring weekly job, not a one-shot — leave
            work for next week rather than exhausting the budget on this
            run. Author portraits are a separate workflow
            (author-portraits.yml); don't do that here even if you notice a
            gap.

            Read ONLY these before starting, not the rest of README.md: the
            "Content pipeline" section (grep README.md for "^## Content
            pipeline", read from there to the next "^## " heading) and
            seed/README.md in full. They define the sourcing rules, the
            rights/PD bar, and the quality bar. Follow them exactly; do not
            relax them because no one's watching. When in doubt about
            rights or quality, reject/skip rather than force something
            live.

            1. Fetch: run `npm run fetch-candidates -- 3`. (Deliberately
               small — each one gets its full text read in step 3, and that
               text stays in this session's context for every step after
               it. Fewer, more often, costs less per run than a big batch.)

            2. If that staged nothing new (pool exhausted or everything's
               already known), grow seed/source-pool.json yourself — but
               capped: at most 3 WebSearch calls and at most 5 verified
               URLs added, then move on regardless of how it went. Look for
               well-known, pre-1930-published poems/essays/short stories on
               Gutenberg, Wikisource, or Standard Ebooks that aren't already
               in seed/works.json or seed/source-pool.json. Verify each URL
               actually resolves to the single work itself (not an index or
               a scanned-page-transclusion Wikisource page — see
               ROADMAP.md's "Pool-growth bottleneck" note on why those get
               skipped) with one WebFetch each, not several. Add verified
               entries to seed/source-pool.json, or if you already have the
               full verbatim text in hand from fetching it, stage it
               directly via a batch JSON file and
               `npm run load-candidates -- <file>` — then delete that batch
               file once loaded, same as any other scratch file.

            3. Review: `npm run review` lists everything with status
               needs_review. For each one:
               - `npm run review -- show <id>` for full detail.
               - If it came from the mechanical fetch path, it has no
                 description yet — read the actual text and write one
                 (1-2 sentences, matching the tone of entries already in
                 seed/works.json — no clichés, no back-cover copy).
               - Assign 2-5 lowercase tags and a region if missing.
               - Judge difficulty (easy/medium/challenging) on vocabulary,
                 syntax, and density, same as seed/README.md describes.
               - Compute era from year yourself: ancient <1800,
                 19th_century 1800-1899, early_20th_century 1900-1929.
               - Confirm rights_status is genuinely public_domain (the
                 96-years-since-publication math in lib/rights.ts, not a
                 guess) before promoting.
               - Fill gaps with
                 `npm run review -- edit <id> --description="..." --tags=a,b,c --region="..." --reading-minutes=N`,
                 then promote with
                 `npm run review -- promote <id> --era=<era> --difficulty=<difficulty>`.
               - Reject anything that fails verification, is a near-
                 duplicate, has garbled/incomplete extracted text, or you
                 can't actually confirm public-domain status for:
                 `npm run review -- reject <id> "reason"`.

            4. Verify before finishing: `npm run lint`, `npx tsc --noEmit`,
               `npm test`, `npm run build` must all pass clean. Redirect
               each to a file and only read the tail if it fails (e.g.
               `npm run build > /tmp/build.log 2>&1 || tail -60
               /tmp/build.log`) — a clean run's full output has no judgment
               call in it, just tokens.

            5. Commit whatever *files* changed (seed/source-pool.json is
               the only one now) with a clear message describing what was
               added/rejected, and push to main. All the database writes
               (promote/reject) already happened live when you ran those
               commands — this commit, if there's anything to commit at
               all, is only for files.

            If a step finds nothing to do (no new candidates), that's a
            normal, successful run — just say so and stop; don't force work
            that isn't there.
