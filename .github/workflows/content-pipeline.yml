name: Daily pipeline

# The whole content operation, unattended, once a day. There is no
# catalogue and no rotation (lib/selection was removed): each run discovers
# three genuinely new public-domain works fresh from the web — one poem, one
# essay, one story — writes their descriptions, promotes them live, pins
# them to today's date in daily_picks (scripts/add-daily.ts). A work is only
# added once its author's portrait is secured (scripts/ensure-author-portrait.ts):
# no portrait, different work. The home page and Archive are just reads of
# daily_picks (lib/dailyPicks.ts).
#
# Also dispatchable by hand (or by app/api/admin/trigger-author-portraits):
#   - portraits-only — the portrait step only, for backfilling authors an
#                      earlier run couldn't get a usable image for.
on:
  schedule:
    - cron: "0 13 * * *" # every day, 13:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          full = discover today's three, promote, portraits (the normal
          daily run). portraits-only = the portrait step only.
        required: false
        default: full
        type: choice
        options:
          - full
          - portraits-only

permissions:
  contents: write
  # anthropics/claude-code-action needs this to fetch an OIDC token for its
  # own auth — without it, the action fails immediately on "Requesting OIDC
  # token..." before ever reaching the actual pipeline steps.
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Independent of --max-budget-usd below — if the action ever fails to
    # honor that flag, this is the backstop that still kills a runaway run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --model: this is rule-following work (explicit criteria in
          # seed/README.md, no open-ended design judgment) — Sonnet is
          # plenty and costs a fraction of the action's default.
          # --max-budget-usd: a hard ceiling. Every other cap in the prompt
          # is a *should*; this is the real backstop. 8 covers three web
          # discoveries (each work's full text read once), the portrait
          # gate, and a couple of work swaps when an author turns out to
          # have no usable portrait.
          claude_args: '--model claude-sonnet-5 --max-budget-usd 8 --allowed-tools "Bash,Read,Edit,Write,WebFetch,WebSearch"'
          prompt: |
            You're running the oneoneone daily pipeline unattended. Each run
            publishes exactly one day's reading: one poem, one essay, one
            story, all brand new to the site, plus their author portraits.
            This is a RECURRING DAILY job — do today's three and stop, don't
            work ahead.

            Mode for this run: ${{ inputs.mode || 'full' }}
              - full           — steps 1–6.
              - portraits-only — step 4 only, as `npm run
                                 ensure-author-portrait -- --all` (the
                                 backlog of authors with portrait_url null),
                                 then steps 5–6 if a file changed.

            NON-NEGOTIABLE: every author whose work you publish today ends
            the run with a real portrait in `authors.portrait_url`. The
            initial-letter mark in components/AuthorMark.tsx is a
            placeholder for the minutes between promoting a work and
            publishing its portrait — it is NOT an acceptable end state for
            a run. If an author has no usable portrait, that is a signal you
            picked the wrong work: swap it (step 4).

            Read these before starting, and nothing else in the repo docs:
              - seed/README.md in full — sourcing rules, the public-domain
                cutoff (lib/rights.ts: 96 years since publication, or the
                author dead 70+ years), text-formatting conventions, the
                quality bar.
              - ROADMAP.md's "Wikisource scanned-page transclusion" section
                — why those pages are normally skipped.
            Follow them exactly. When in doubt about rights or quality, pick
            something else — never publish a work you can't confirm is
            public domain.

            TODAY is the workflow run date in UTC (date -u +%F).

            1. CHECK: `npm run review -- list` and a quick
               `psql "$DATABASE_URL" -c "select category, title from works order by created_at desc limit 30"`
               so you know what's already been used — never repeat a title
               or author already in `works`, and never reuse a `source_url`.

            2. DISCOVER — for each of poem, essay, story, draw up a SHORT
               LIST of 3-4 well-known, pre-1930-published works on Project
               Gutenberg, Standard Ebooks, or Wikisource that aren't already
               used, by different authors. Use WebSearch to find candidates
               and WebFetch to confirm each URL resolves to the single work
               itself (not an index, not a collection, not a
               scan-transclusion page). Prefer variety across runs —
               different eras, regions, and authors than the last few days.
               You need a short list because a work whose author has no
               usable portrait gets dropped in step 3.

            3. PORTRAIT GATE + ADD — work through one category at a time.
               Take the top work on that category's short list and, BEFORE
               adding it, secure its author's portrait:

                 `npm run ensure-author-portrait -- "<Author Name>"`

               This fetches candidates (Wikipedia + license-filtered
               Wikimedia Commons), crops each around the detected face,
               scores them, and publishes the best to R2 + `authors.portrait_url`
               — or exits non-zero if nothing clears the quality bar.
               - Exit 0 → eyeball the published result (ensure- already
                 cleared _staging): `curl -s "$(psql "$DATABASE_URL" -tAc
                 "select portrait_url from authors where name = '<Author>'")"
                 -o /tmp/p.png` then Read /tmp/p.png. A real, recognizable
                 face → keep this work, run add-daily for it (below). A bad
                 crop despite the passing score → treat it like exit
                 non-zero.
               - Exit non-zero (or bad crop) → this work is out. Cross the
                 author off, take the next work on the short list, and
                 repeat the gate. If the whole short list is exhausted, go
                 back to step 2 for that category. Do NOT add a work whose
                 author has no portrait.

               add-daily for a work that cleared the gate:
               `npm run add-daily -- --date=<TODAY> --category=<cat>
                 --title="…" --author="…" --year=<publication year>
                 --source-name="…" --source-url="…"
                 --text-file=/tmp/<cat>.txt
                 --era=<ancient|19th_century|early_20th_century> (from the
                 year; the script computes it if omitted)
                 --difficulty=<easy|medium|challenging> (judge from
                 vocabulary, syntax, density — seed/README.md)
                 --region="…" --tags=<2-5 lowercase, comma-separated>`
               (save the cleaned full text, boilerplate stripped per
               seed/README.md, to /tmp/<cat>.txt first). Omit --description
               to let it auto-generate, or pass one you've written (1-2
               sentences, the tone of seed/README.md — no clichés, no
               back-cover copy). If a work's PD status rests on the author's
               death rather than publication year, add
               `--author-death-year=<year>`. The script stages, promotes,
               and pins to daily_picks in one step; if it errors, fix the
               input or pick a different work — do NOT hand-edit the DB.

               After all three categories: confirm with
               `psql "$DATABASE_URL" -c "select dp.category, w.author_name, (a.portrait_url is not null) as has_portrait from daily_picks dp join works w on w.id = dp.work_id join authors a on a.name = w.author_name where dp.pick_date = '<TODAY>'"`
               — exactly three rows, every has_portrait = t.

            4. PORTRAIT BACKLOG (portraits-only mode, or a spare moment in
               full mode) — `npm run ensure-author-portrait -- --all`
               retries every author with portrait_url null. It's cheap
               (Wikipedia + Commons API calls, no model), so there's no
               per-run cap; just let it run. Any author it still can't place
               stays on the initial-letter mark until a future run or a
               manual `npm run publish-author-portrait` from a hand-picked
               source.

            5. VERIFY: `npm run lint`, `npx next typegen && npx tsc
               --noEmit`, `npm test`, `npm run build` must all pass clean.
               Redirect each to a file, read the tail only on failure
               (e.g. `npm run build > /tmp/build.log 2>&1 || tail -60
               /tmp/build.log`).

            6. COMMIT — only if a tracked file actually changed (normally
               nothing does: works, daily_picks, and portrait_url are all
               live DB/R2 writes, and public/authors/_source and _staging
               are gitignored — delete anything left there rather than
               committing it). If there is something, use a message naming
               the three works added and any portraits published, and push
               to main.

            "Published today's three, every author has a portrait" is the
            normal successful result — report what you did (including any
            works you swapped out for a missing portrait) and stop.
